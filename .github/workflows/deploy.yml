name: Deploy Portfolio and Fetch Telemetry

on:
  # Allows you to manually trigger the deployment from the Actions tab in GitHub
  workflow_dispatch:
  # Runs automatically every 12 hours
  schedule:
    - cron: '0 */12 * * *'
  # Triggers when you manually push HTML/CSS changes to the main branch
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allows only one concurrent deployment to prevent race conditions
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute UI Structural Updates
        run: python update_ui.py
        # Failure Meaning: If this fails, there is a syntax error in update_ui.py or it is trying to access a file path that does not exist in the Ubuntu runner's directory tree.

      - name: Fetch Live Telemetry Data
        env:
          # Your actual Fly.io API endpoint for telemetry
          TASK_TRACKER_URL: 'https://task-tracker-web.fly.dev/portfolio-telemetry'
          # Pulls the secret key securely from GitHub Secrets
          TELEMETRY_SECRET_KEY: ${{ secrets.TELEMETRY_SECRET_KEY }}
        run: python fetch_telemetry.py
        # Failure Meaning: If this fails, the runner successfully executed the Python script, but the script exited with an error. Check the Actions log output to see if it was a missing credential, a network timeout, or if the TASK_TRACKER_URL is still set to the placeholder string.

      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/data/telemetry.json
          git commit -m "chore: sync telemetry data" || echo "No changes to commit"
          git push
        # Failure Meaning: If this fails, either the permissions block at the top of the YAML is missing 'contents: write', the file path 'assets/data/telemetry.json' is incorrect so the bot cannot find it, or a simultaneous repository update caused a push conflict.

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # Failure Meaning: If this fails, the runner could not package the directory. This usually happens if the root directory is empty or permissions are misconfigured.

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Failure Meaning: If this fails, the artifact was built successfully, but GitHub's internal servers rejected the deployment to the live URL. This is almost always solved by verifying the repository's 'Pages' settings are set to 'GitHub Actions'.