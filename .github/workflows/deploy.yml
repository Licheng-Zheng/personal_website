name: Deploy Portfolio and Fetch Telemetry

on:
  # Allows you to manually trigger the deployment from the Actions tab in GitHub
  workflow_dispatch:
  # Runs automatically every 12 hours
  schedule:
    - cron: '0 */12 * * *'
  # Triggers when you manually push HTML/CSS changes to the main branch
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allows only one concurrent deployment to prevent race conditions
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute UI Structural Updates
        run: python update_ui.py
        # Failure Meaning: If this fails, there is a syntax error in update_ui.py or it is trying to access a file path that does not exist in the Ubuntu runner's directory tree.

      - name: Fetch Live Telemetry Data
        env:
          # Define your actual production API URL here
          TASK_TRACKER_URL: 'https://YOUR_API_DOMAIN_HERE/portfolio-telemetry'
          # Pull the secret key securely from GitHub Secrets
          TELEMETRY_SECRET_KEY: ${{ secrets.TELEMETRY_SECRET_KEY }}
        run: python fetch_telemetry.py
        # Failure Meaning: If this fails, the runner successfully executed the Python script, but the script exited with an error. Check the Actions log output to see if it was a missing credential or a network timeout.

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # Failure Meaning: If this fails, the runner could not package the directory. This usually happens if the root directory is empty or permissions are misconfigured.

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Failure Meaning: If this fails, the artifact was built successfully, but GitHub's internal servers rejected the deployment to the live URL. This is almost always solved by verifying the repository's 'Pages' settings are set to 'GitHub Actions'.